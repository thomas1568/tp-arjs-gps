
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>TP MMI - Réalité augmentée NFT</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- AR.js avec reconnaissance d'image NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Le flux caméra est placé derrière la scène 3D */
    #arjs-video,
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    #interface {
      position: fixed;
      top: 15px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      padding: 14px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #etat {
      margin-top: 8px;
      color: #7dd3fc;
    }

    #details {
      margin-top: 6px;
      font-size: 12px;
      color: #ddd;
      overflow-wrap: anywhere;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="interface">
    <strong>TP MMI - Scan NFT</strong>
    <div id="etat">Initialisation de la réalité augmentée...</div>
    <div id="details">Chargement...</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="trackingMethod: best;
          sourceType: webcam;
          debugUIEnabled: false;">

    <a-assets timeout="30000">
      <a-asset-item
        id="modele3d"
        src="../assets/personnage.glb">
      </a-asset-item>
    </a-assets>

    <!-- Image NFT à reconnaître -->
    <a-nft
      id="marqueur"
      type="nft"
      url="./assets/IMG_9765"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Personnage 3D -->
      <a-entity
        id="personnage"
        gltf-model="#modele3d"
        position="0 0 0"
        rotation="-90 0 0"
        scale="1 1 1">
      </a-entity>

    </a-nft>

    <!-- Caméra virtuelle AR.js -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const etat = document.getElementById("etat");
    const details = document.getElementById("details");
    const marqueur = document.getElementById("marqueur");
    const personnage = document.getElementById("personnage");
    const scene = document.querySelector("a-scene");

    let nftPret = false;
    let marqueurVisible = false;
    let modeleCharge = false;

    function afficherEtat(message) {
      etat.textContent = message;
    }

    function afficherDetails() {
      const video = document.querySelector(
        "#arjs-video, video"
      );

      let camera = "introuvable";

      if (video) {
        camera = video.readyState >= 2
          ? "active"
          : "en cours de chargement";
      }

      details.textContent =
        "Caméra : " + camera +
        " | NFT : " + (nftPret ? "prêt" : "en attente") +
        " | Modèle : " + (modeleCharge ? "chargé" : "en attente");
    }

    scene.addEventListener("loaded", function () {
      afficherEtat("Scène 3D chargée. Initialisation caméra...");
      afficherDetails();
    });

    scene.addEventListener("camera-init", function () {
      afficherEtat("Caméra initialisée. Chargement NFT...");
      afficherDetails();
    });

    scene.addEventListener("camera-error", function (event) {
      afficherEtat("Erreur d'initialisation de la caméra");
      details.textContent = JSON.stringify(event.detail || {});
    });

    marqueur.addEventListener("arjs-nft-loaded", function () {
      nftPret = true;
      afficherEtat("NFT prêt ! Dirige la caméra vers IMG_9765.");
      afficherDetails();
    });

    marqueur.addEventListener("markerFound", function () {
      marqueurVisible = true;
      afficherEtat("Image reconnue ! Personnage détecté.");
      afficherDetails();
    });

    marqueur.addEventListener("markerLost", function () {
      marqueurVisible = false;
      afficherEtat("Image perdue. Repositionne la caméra.");
      afficherDetails();
    });

    personnage.addEventListener("model-loaded", function () {
      modeleCharge = true;
      afficherDetails();
    });

    personnage.addEventListener("model-error", function () {
      afficherEtat("Erreur : impossible de charger le modèle 3D.");
    });

    window.addEventListener("error", function (event) {
      afficherEtat("Erreur JavaScript");
      details.textContent = event.message || "Erreur inconnue";
    });

    window.addEventListener("unhandledrejection", function (event) {
      afficherEtat("Erreur de chargement");
      details.textContent = String(event.reason);
    });

    setInterval(function () {
      afficherDetails();

      if (marqueurVisible) {
        afficherEtat("Image reconnue ! Personnage affiché.");
      }
    }, 1500);
  </script>

</body>
</html>
