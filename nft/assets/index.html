
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TP MMI - Scan NFT</title>

  <!-- Bibliothèque A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- Bibliothèque AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 60px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      font-size: 14px;
      line-height: 1.5;
    }

    #status strong {
      color: #55d9ff;
    }
  </style>
</head>

<body>

  <div id="status">
    <strong>TP MMI - Image Tracking NFT</strong>
    <div id="message">
      Initialisation de la caméra...
    </div>
  </div>

  <!-- Scène AR -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">

    <!-- Marqueur NFT -->
    <a-nft
      id="marqueur"
      type="nft"
      url="./assets/IMG_9765"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- Personnage 3D -->
      <a-entity
        id="personnage"
        gltf-model="url(../assets/personnage.glb)"
        scale="1 1 1"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>

    </a-nft>

    <!-- Caméra -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const message = document.getElementById("message");
    const marqueur = document.getElementById("marqueur");
    const personnage = document.getElementById("personnage");

    function afficher(texte) {
      message.textContent = texte;
      console.log("[NFT]", texte);
    }

    // Initialisation de la scène
    document.querySelector("a-scene")
      .addEventListener("loaded", () => {
        afficher("Scène chargée. Initialisation NFT...");
      });

    // NFT chargé
    window.addEventListener("arjs-nft-loaded", () => {
      afficher("NFT prêt. Scanne l'image !");
    });

    // Image reconnue
    marqueur.addEventListener("markerFound", () => {
      afficher("Image reconnue ! Personnage affiché.");
    });

    // Image perdue
    marqueur.addEventListener("markerLost", () => {
      afficher("Image perdue. Recadre l'image.");
    });

    // Modèle 3D chargé
    personnage.addEventListener("model-loaded", () => {
      console.log("Personnage GLB chargé.");
    });

    personnage.addEventListener("model-error", (event) => {
      afficher("Erreur de chargement du personnage GLB.");
      console.error(event.detail);
    });

    // Diagnostic JavaScript
    window.addEventListener("error", (event) => {
      console.error(event);
    });
  </script>

</body>
</html>
