
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TP AR.js - Test 3D</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 9999;
      padding: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div id="status">
    Chargement de la scène 3D...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    background="color: #202840">

    <!-- Caméra fixe -->
    <a-entity
      camera
      position="0 1.6 0"
      look-controls="enabled: false">
    </a-entity>

    <!-- Cube bleu -->
    <a-box
      position="0 1.6 -3"
      width="1.5"
      height="1.5"
      depth="1.5"
      rotation="0 45 0"
      color="#00BFFF">
    </a-box>

    <!-- Lumière ambiante -->
    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="1">
    </a-light>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
      status.textContent =
        "Scène A-Frame chargée. Le cube doit être visible.";
    });

    scene.addEventListener("renderstart", () => {
      status.textContent =
        "Rendu 3D démarré. Cherche le cube bleu.";
    });

    scene.addEventListener("rendererinitialized", () => {
      console.log("Renderer initialisé");
    });

    scene.addEventListener("error", (event) => {
      status.textContent =
        "Erreur de rendu : " + event.message;
    });
  </script>

</body>
</html>
