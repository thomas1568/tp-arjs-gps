<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image à scanner · TP AR.js</title>
  <script src="./targets.js?v=20261110-5" defer></script>
  <script src="./cible.js?v=20261110-5" defer></script>
  <style>
    body { margin: 0; padding: 24px; background: #f4f6f2; color: #17372a; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; }
    p { line-height: 1.6; }
    img { display: block; width: 100%; height: auto; margin: 24px auto; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a, button { display: inline-block; padding: 12px 16px; border: 1px solid #17372a; border-radius: 8px; color: inherit; background: transparent; font: inherit; cursor: pointer; }
    select { padding: 10px; margin: 8px; font: inherit; max-width: 100%; }
    @page { size: landscape; margin: 15mm; }
    @media print { body { padding: 0; background: white; } h1, h2, p, label, nav { display: none; } main { max-width: none; } img { width: auto; max-width: 100%; height: 165mm; margin: 0 auto; object-fit: contain; } }
  </style>
</head>
<body>
  <main>
    <h1>L’image qui déclenche l’animation MMI</h1>
    <label for="choix-cible">Image cible
      <select id="choix-cible">
        <option value="mmi">Image MMI avec le logo (recommandée)</option>
        <option value="photo">Ancienne photo sans logo</option>
      </select>
    </label>
    <h2 id="cible-nom">Image MMI avec le logo</h2>
    <p>Garde cette page ouverte sur un ordinateur ou imprime l’image.<br>Depuis ton téléphone, ouvre le scanner et vise toute l’image ci-dessous.</p>
    <img id="cible-image" src="./assets/MMI-cible.png" width="1280" height="960" alt="Cible MMI complète : logo crème et violet sur le cercle turquoise, avec les triangles colorés.">
    <nav aria-label="Actions">
      <button type="button" onclick="window.print()">Imprimer l’image</button>
      <a id="telecharger-cible" href="./assets/MMI-cible.png" download="MMI-cible.png">Télécharger l’image</a>
      <a id="ouvrir-scanner" href="./?cible=mmi">Ouvrir le scanner</a>
    </nav>
  </main>
</body>
</html>
