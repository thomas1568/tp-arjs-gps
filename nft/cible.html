<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image à scanner · TP AR.js</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f6f2; color: #17372a; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 24px; }
    p { line-height: 1.6; }
    img { display: block; width: 100%; height: auto; margin: 24px auto; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a, button { display: inline-block; padding: 12px 16px; border: 1px solid #17372a; border-radius: 8px; color: inherit; background: transparent; font: inherit; cursor: pointer; }
    @page { size: landscape; margin: 15mm; }
    @media print { body { padding: 0; background: white; } h1, p, nav { display: none; } main { max-width: none; } img { width: auto; max-width: 100%; height: 165mm; margin: 0 auto; object-fit: contain; } }
  </style>
</head>
<body>
  <main>
    <h1>L’image qui déclenche l’animation MMI</h1>
    <p>Garde cette page ouverte sur un ordinateur ou imprime l’image.<br>Depuis ton téléphone, ouvre le scanner et vise toute l’image ci-dessous.</p>
    <img src="./assets/IMG_9765.webp" width="1280" height="960" alt="Cible NFT complète : cercle turquoise et triangles sur un mur clair.">
    <nav aria-label="Actions">
      <button type="button" onclick="window.print()">Imprimer l’image</button>
      <a href="./assets/IMG_9765.webp" download="image-a-scanner.webp">Télécharger l’image</a>
      <a href="./">Ouvrir le scanner</a>
    </nav>
  </main>
</body>
</html>
