
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Test caméra iPhone</title>
  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    video {
      width: 100%;
      height: 75vh;
      object-fit: cover;
      background: black;
    }

    button {
      padding: 15px;
      margin: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>Test caméra Safari</h2>
  <button id="start">Démarrer la caméra</button>
  <p id="status">En attente...</p>
  <video id="video" autoplay muted playsinline></video>

  <script>
    document.getElementById("start").onclick = async () => {
      const status = document.getElementById("status");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" }
          }
        });

        const video = document.getElementById("video");
        video.srcObject = stream;
        await video.play();

        status.textContent = "Caméra active !";
      } catch (error) {
        status.textContent =
          "Erreur : " + error.name + " - " + error.message;
      }
    };
  </script>
</body>
</html>
