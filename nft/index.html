
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TP MMI - Scan NFT</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101827;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #interface {
      position: fixed;
      top: 65px;
      left: 12px;
      right: 12px;
      z-index: 99999;
      background: rgba(0,0,0,.85);
      color: white;
      border-radius: 12px;
      padding: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    #titre {
      color: #55d9ff;
      font-weight: bold;
    }

    #message {
      margin-top: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    button {
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #19a86b;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
  </style>

  <script
    src="https://aframe.io/releases/1.0.4/aframe.min.js">
  </script>

  <script
    src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js">
  </script>
</head>

<body>

  <div id="interface">
    <div id="titre">TP MMI - Scan NFT</div>
    <div id="message">Vérification des bibliothèques...</div>
    <button id="demarrer">Autoriser la caméra</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false">

    <a-nft
      id="marqueur"
      type="nft"
      url="./assets/IMG_9765"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity
        id="personnage"
        gltf-model="url(../assets/personnage.glb)"
        scale="1 1 1"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const message = document.getElementById("message");
    const bouton = document.getElementById("demarrer");
    const scene = document.querySelector("a-scene");
    const marqueur = document.getElementById("marqueur");
    const personnage = document.getElementById("personnage");

    let cameraOK = false;
    let nftOK = false;
    let modeleOK = false;

    function afficher(texte) {
      message.textContent = texte;
      console.log("[TP NFT]", texte);
    }

    // Vérifier les bibliothèques
    if (typeof AFRAME === "undefined") {
      afficher("ERREUR : A-Frame non chargé.");
    } else if (!AFRAME.components["nft"]) {
      afficher(
        "ERREUR : composant NFT absent. Vérifier AR.js."
      );
    } else {
      afficher("Bibliothèques détectées. Attente caméra...");
    }

    // Demander l'accès caméra
    bouton.addEventListener("click", async () => {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        afficher("Caméra indisponible dans ce navigateur.");
        return;
      }

      try {
        afficher("Demande d'autorisation caméra...");

        const flux = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" }
          }
        });

        cameraOK = true;
        afficher(
          "Caméra autorisée. Initialisation AR.js..."
        );

        // Libérer la caméra pour AR.js
        flux.getTracks().forEach(track => track.stop());

        bouton.style.display = "none";

      } catch (erreur) {
        afficher(
          "Erreur caméra : " +
          erreur.name + " - " + erreur.message
        );
      }
    });

    scene.addEventListener("loaded", () => {
      console.log("Scène A-Frame chargée.");
    });

    // Événements AR.js
    window.addEventListener("arjs-video-loaded", () => {
      cameraOK = true;
      afficher("Caméra AR.js active. Chargement NFT...");
    });

    window.addEventListener("arjs-video-error", () => {
      afficher("AR.js n'arrive pas à ouvrir la caméra.");
    });

    window.addEventListener("arjs-nft-loaded", () => {
      nftOK = true;
      afficher("NFT prêt ! Scanne IMG_9765.");
    });

    // Reconnaissance
    marqueur.addEventListener("markerFound", () => {
      afficher(
        modeleOK
          ? "Image reconnue ! Modèle chargé."
          : "Image reconnue. Attente du modèle..."
      );
    });

    marqueur.addEventListener("markerLost", () => {
      afficher("Image perdue. Recadre la photo.");
    });

    // Modèle GLB
    personnage.addEventListener("model-loaded", () => {
      modeleOK = true;
      console.log("Modèle GLB chargé.");

      if (nftOK) {
        afficher("NFT prêt. Modèle chargé. Scanne la photo.");
      }
    });

    personnage.addEventListener("model-error", (event) => {
      afficher("Erreur : personnage.glb non chargé.");
      console.error(event.detail);
    });

    // Diagnostic
    window.addEventListener("error", event => {
      console.error("Erreur JS :", event);

      if (event.message !== "Script error.") {
        afficher("Erreur JavaScript : " + event.message);
      }
    });

    window.addEventListener("unhandledrejection", event => {
      console.error("Erreur asynchrone :", event.reason);
    });

    setTimeout(() => {
      if (!nftOK) {
        afficher(
          "NFT pas encore prêt.\n" +
          "Caméra autorisée : " + cameraOK + "\n" +
          "Modèle chargé : " + modeleOK + "\n" +
          "Vérifie les fichiers NFT et les scripts."
        );
      }
    }, 20000);
  </script>

</body>
</html>
