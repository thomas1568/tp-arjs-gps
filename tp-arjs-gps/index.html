
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TP AR.js - GPS Corte</title>

  <!-- A-Frame : moteur de scène 3D -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js : géolocalisation -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true">

    <!-- Objet 3D positionné à Corte -->
    <a-entity
      gps-new-entity-place="latitude: 42.306699560260455; longitude: 9.148512279247452"
      gltf-model="url(assets/personnage.glb)"
      scale="1 1 1"
      position="0 0 0"
      rotation="0 0 0">
    </a-entity>

    <!-- Caméra du smartphone avec GPS -->
    <a-camera
      gps-new-camera="gpsMinDistance: 5"
      look-controls
      wasd-controls="enabled: false">
    </a-camera>

  </a-scene>

</body>
</html>
